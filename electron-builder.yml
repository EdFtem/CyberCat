appId: ai.cybercat.app
productName: CyberCat
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/ssh2/**
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
  category: Utility
